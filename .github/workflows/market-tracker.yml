name: FC27 Market Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - "tracker.py"
      - "requirements.txt"
      - ".github/workflows/market-tracker.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: fc27-market-tracker
  cancel-in-progress: false

jobs:
  track-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tracker.py
      - name: Commit updated data
        run: |
          git config user.name "FC27 Market Tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json prices.csv signals.csv report.md
          git diff --cached --quiet || git commit -m "Update FC27 market data"
          git push
